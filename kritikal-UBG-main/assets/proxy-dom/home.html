<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kobran - New Tab</title>
  <link rel="stylesheet" href="/assets/kobran-page.css">
  <style>
    :root{--accent1:#7C3AED;--accent2:#06B6D4}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,-apple-system,"Helvetica Neue",Arial;color:#e6eef7;background:linear-gradient(135deg,#040617,#071033);display:flex;align-items:center;justify-content:center}
    .kobran-hero{text-align:center}
    .kobran-logo{width:96px;border-radius:12px}
    .kobran-title{font-family:Orbitron,system-ui,sans-serif;font-size:44px;margin:12px 0}
    .kobran-search input{padding:12px 14px;width:420px;max-width:78vw;border-radius:999px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:inherit}
    .kobran-search button{margin-left:8px;padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;cursor:pointer}
    .kobran-back{position:fixed;left:16px;top:16px;color:inherit;text-decoration:none;opacity:.9}
  </style>
</head>
<body>
  <div class="kobran-hero">
    <a class="kobran-back" href="/">← Home</a>
    <img src="/Kobran.png" alt="Kobran" class="kobran-logo" />
    <h1 class="kobran-title">Kobran</h1>
    <form id="searchForm" class="kobran-search" action="https://www.google.com/search" method="GET" target="_blank">
      <input name="q" id="searchInput" placeholder="Search Google or type a URL" autocomplete="off" />
      <button type="submit">Search</button>
    </form>
  </div>
  <script>
    const input = document.getElementById('searchInput');
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('searchForm').submit();
    });
  </script>
</body>
</html>
