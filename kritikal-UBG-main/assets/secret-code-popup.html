<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Code Menu | Zentra</title>
  <link rel="stylesheet" href="/assets/zentra-page.css">
  <style>
    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .secret-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .secret-hero {
      text-align: center;
      max-width: 520px;
      cursor: pointer;
      user-select: none;
    }

    .secret-hero__lock {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.22), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(183, 148, 255, 0.28);
      box-shadow: 0 0 40px rgba(124, 92, 255, 0.18);
      font-size: 2rem;
    }

    .secret-hero h1 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .secret-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 2, 8, 0.72);
      backdrop-filter: blur(12px);
    }

    .secret-overlay--open {
      display: flex;
    }

    .secret-modal {
      width: min(440px, 100%);
      padding: 28px;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(18, 14, 34, 0.98), rgba(8, 8, 16, 0.98));
      border: 1px solid rgba(183, 148, 255, 0.24);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), 0 0 50px rgba(124, 92, 255, 0.12);
      position: relative;
    }

    .secret-modal__close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .secret-modal__badge {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(124, 92, 255, 0.18);
      border: 1px solid rgba(183, 148, 255, 0.24);
      margin-bottom: 14px;
    }

    .secret-modal h2 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 1.6rem;
    }

    .secret-modal__field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .secret-modal__field label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .secret-modal__field input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .secret-modal__field input:focus {
      border-color: rgba(183, 148, 255, 0.45);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.12);
    }

    .secret-modal__actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .secret-modal__actions .secret-unlock-btn {
      flex: 1;
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #0a0a0a;
      cursor: pointer;
      background: linear-gradient(135deg, #ffffff 0%, #d4d4d4 45%, #ffffff 100%);
      background-size: 200% 200%;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.22),
        0 10px 30px rgba(0, 0, 0, 0.35),
        0 0 28px rgba(255, 255, 255, 0.12);
      transition: transform 0.22s ease, box-shadow 0.22s ease, background-position 0.45s ease;
      animation: secret-unlock-shine 3.2s ease-in-out infinite;
    }

    .secret-modal__actions .secret-unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.32),
        0 14px 36px rgba(0, 0, 0, 0.42),
        0 0 40px rgba(255, 255, 255, 0.2);
    }

    .secret-modal__actions .secret-unlock-btn:active {
      transform: translateY(0) scale(0.98);
    }

    @keyframes secret-unlock-shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .secret-modal__actions .zentra-page__btn {
      flex: 1;
    }

    .secret-modal__back {
      flex: 0 0 auto;
    }

    .secret-message {
      min-height: 1.2em;
      margin-top: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      color: #fb7185;
    }

    .secret-message--ok {
      color: #6ee7b7;
    }
  </style>
</head>
<body class="zentra-page">
  <div class="zentra-page__glow" aria-hidden="true"></div>
  <div class="secret-shell">
    <div class="secret-hero" id="openPopup">
      <div class="secret-hero__lock" aria-hidden="true">🔐</div>
      <h1>Secret Code Menu</h1>
    </div>
  </div>

  <div class="secret-overlay" id="popupOverlay">
    <div class="secret-modal" role="dialog" aria-modal="true" aria-labelledby="secret-modal-title">
      <button type="button" class="secret-modal__close" id="closePopup" aria-label="Close">✕</button>
      <span class="secret-modal__badge">Restricted access</span>
      <h2 id="secret-modal-title">Enter secret code</h2>
      <div class="secret-modal__field">
        <label for="secretInput">Access code</label>
        <input type="text" id="secretInput" placeholder="Type secret code..." autocomplete="off" spellcheck="false">
      </div>
      <div class="secret-modal__actions">
        <a class="zentra-page__link secret-modal__back" href="/">Back</a>
        <button type="button" class="secret-unlock-btn" id="submitCode">Unlock</button>
      </div>
      <div class="secret-message" id="message"></div>
    </div>
  </div>

  <script src="/assets/background.js"></script>
</body>
</html>
