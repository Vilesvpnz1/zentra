<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kobran Apps</title>
    <link id="favicon" rel="shortcut icon" type="image/png" href="/Kobran.png" />
    <link rel="stylesheet" href="/app-viewer/scarmjet-embed.css?v=6" />
    <style>
      #kobranAppsBack {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 100000;
      }
      #kobranAppsBack a {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font: 600 0.82rem/1 system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(10px);
      }
      html.proxy-embed #viewerBar,
      html.proxy-embed #settings-panel {
        display: none !important;
      }
      html.proxy-embed #iframe-container,
      html.proxy-embed #iframe-container iframe {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        border: 0;
        display: block;
        background: #000;
        contain: none !important;
        content-visibility: visible !important;
      }
      html.proxy-home #kobranAppsBack {
        display: block !important;
      }
    </style>
    <script>
      document.documentElement.classList.add("proxy-embed");
      if (new URLSearchParams(location.search).get("home") === "1") {
        document.documentElement.classList.add("proxy-home");
      }
    </script>
    <script>
      (function () {
        if (sessionStorage.getItem("scramjet-db-sync") === "2") return;
        sessionStorage.setItem("scramjet-db-sync", "2");
        try {
          indexedDB.deleteDatabase("$scramjet");
        } catch (e) {}
      })();
      (function () {
        try {
          var ws = localStorage.getItem("proxy-ws") || "";
          if (!ws || ws.indexOf("classroom.lat") !== -1) {
            localStorage.removeItem("proxy-ws");
          }
        } catch (e) {}
      })();
    </script>
    <script src="/sail/scram/scram-idb.js?v=3"></script>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js?v=3"></script>
  </head>
  <body class="proxy-embed">
    <div id="kobranAppsBack">
      <a href="/#apps" id="kobranAppsBackLink">← Back to Apps</a>
    </div>
    <div id="viewerBar">
      <p id="viewerTitle">Loading...</p>
    </div>
    <div id="settings-panel"></div>
    <div id="iframe-container"></div>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        if (sessionStorage.getItem("kobran-sail-sw") === "3") return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) {
            sessionStorage.setItem("kobran-sail-sw", "3");
            return;
          }
          return Promise.all(
            regs.map(function (r) {
              return r.unregister();
            })
          ).then(function () {
            sessionStorage.setItem("kobran-sail-sw", "3");
            location.reload();
          });
        });
      })();
    </script>
    <script src="/app-viewer/js/scarmjet.js?v=15"></script>
    <script>
      (function () {
        if (new URLSearchParams(location.search).get("home") !== "1") return;
        var link = document.getElementById("kobranAppsBackLink");
        if (!link) return;
        link.href = "/#home";
        link.textContent = "← Back to Kobran";
      })();
    </script>
  </body>
</html>
