<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zentra Apps</title>
    <link id="favicon" rel="shortcut icon" type="image/png" href="/Kritikal.png" />
    <link rel="stylesheet" href="/app-viewer/scarmjet-embed.css?v=6" />
    <style>
      #zentraAppsBack {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 100000;
      }
      #zentraAppsBack a {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font: 600 0.82rem/1 system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(10px);
      }
      html.proxy-embed #viewerBar,
      html.proxy-embed #settings-panel {
        display: none !important;
      }
      html.proxy-embed #iframe-container,
      html.proxy-embed #iframe-container iframe {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        border: 0;
        display: block;
        background: #000;
        contain: none !important;
        content-visibility: visible !important;
      }
    </style>
    <script>
      document.documentElement.classList.add("proxy-embed");
    </script>
    <script src="/sail/scram/scram-idb.js"></script>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
  </head>
  <body class="proxy-embed">
    <div id="zentraAppsBack">
      <a href="/#apps" id="zentraAppsBackLink">← Back to Apps</a>
    </div>
    <div id="viewerBar">
      <p id="viewerTitle">Loading...</p>
    </div>
    <div id="settings-panel"></div>
    <div id="iframe-container"></div>
    <script src="/app-viewer/js/scarmjet.js?v=9"></script>
  </body>
</html>
