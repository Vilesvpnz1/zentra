<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zentra - Games</title>
    <link id="favicon" rel="shortcut icon" type="image/png" href="/Kritikal.png" />
    <link rel="stylesheet" href="/app-viewer/scarmjet-embed.css?v=5" />
    <style>
      #zentraAppsBack {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 100000;
      }
      #zentraAppsBack a {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font: 600 0.82rem/1 system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(10px);
      }
      html.zentra-apps #zentraAppsBack {
        display: block;
      }
      html.proxy-embed #iframe-container,
      html.proxy-embed #iframe-container iframe {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        border: 0;
        display: block;
        background: #000;
        contain: none !important;
        content-visibility: visible !important;
      }
    </style>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get("embed") === "1" || params.get("chrome") === "0") {
          document.documentElement.classList.add("proxy-embed");
        }
        if (params.get("zentra") === "1") {
          document.documentElement.classList.add("zentra-apps");
        }
      })();
    </script>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
  </head>
  <body class="proxy-embed">
    <div id="zentraAppsBack">
      <a href="/#apps" id="zentraAppsBackLink">← Back to Apps</a>
    </div>
    <div id="viewerBar">
      <p id="viewerTitle">Loading...</p>
      <div id="Btn-Group">
        <a class="bloxy-blue-btn bloxy-btn" href="/apps">Close</a>
        <a class="bloxy-blue-btn bloxy-btn" id="closeViewer" href="https://google.com/" target="_top">Google</a>
        <a class="bloxy-blue-btn bloxy-btn" id="openNewTab">Play In New Tab</a>
        
        <svg class="clog-btn" onclick="toggleSettings()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path d="M259.173.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z" />
        </svg>
      </div>
    </div>

    <div id="settings-panel">
      <div class="header">
        <span>Settings</span>
        <span class="close-x" onclick="toggleSettings()">&times;</span>
      </div>
      
      <label style="font-size: 11px; color: #888;">Wisp Server</label>
      <select id="ws-select">
        <option value="default">Default (wisp.classroom.lat)</option>
        <option value="custom">Custom URL</option>
      </select>

      <div id="custom-ws-group" style="display: none;">
        <input type="text" id="custom-ws-input" placeholder="wss://...">
      </div>

      <button class="save-btn" onclick="saveSettings()">Save & Reload</button>
    </div>

    <div id="iframe-container"></div>

    <script src="/app-viewer/js/scarmjet.js?v=6"></script>
    <script>
      (function () {
        var link = document.getElementById("zentraAppsBackLink");
        if (!link) return;
        link.addEventListener("click", function () {
          try {
            sessionStorage.setItem("zentra-apps-skip-auto", "1");
          } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
