    .apps-card{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
    .apps-card:hover{transform:translateY(-4px);border-color:rgba(183,148,255,0.35);box-shadow:0 16px 40px rgba(0,0,0,0.28),0 0 24px rgba(124,92,255,0.12)}
    .apps-card__icon{width:64px;height:64px;object-fit:contain;border-radius:14px;filter:drop-shadow(0 8px 18px rgba(124,92,255,0.25))}
    .apps-card__title{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:1.05rem}
    .apps-card__tag{margin:0;font-size:0.78rem;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em}

    function render(list) {
      grid.innerHTML = "";
      list.forEach(function (app) {
        var card = document.createElement("article");
        card.className = "apps-card";
        card.innerHTML =
          '<img class="apps-card__icon" src="' + app.img + '" alt="">' +
          '<p class="apps-card__tag">' + app.tag + '</p>' +
          '<h3 class="apps-card__title">' + app.name + '</h3>' +
          '<div class="apps-card__actions"><a class="zentra-page__btn" href="' + app.href + '">Open</a></div>';
    grid.appendChild(card);
  });
      countEl.textContent = list.length + " app" + (list.length === 1 ? "" : "s");
    }

    function filterApps() {
      var q = search.value.trim().toLowerCase();
      if (!q) return render(APPS);
      render(APPS.filter(function (a) {
        return (a.name + " " + a.tag).toLowerCase().indexOf(q) !== -1;
      }));
    }

    search.addEventListener("input", filterApps);
    render(APPS);
