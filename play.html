<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad; microphone; camera" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    (function () {
      var frame = document.getElementById("frame");
      var params = new URLSearchParams(location.search);
      var queue = [];
      var attempt = 0;

      function isBlockedCdn(url) {
        const u = String(url || "").toLowerCase();
        if (/cdn\.jsdelivr\.net\/gh\/3kh0\/3kh0-lite/i.test(u)) return true;
        if (/raw\.githack\.com\/3kh0\/3kh0-lite/i.test(u)) return true;
        if (/raw\.githubusercontent\.com\/3kh0\/3kh0-lite/i.test(u)) return true;
        return false;
      }

      function pushTarget(raw) {
        var u = String(raw || "").trim();
        if (!u || isBlockedCdn(u)) return;
        if (queue.indexOf(u) === -1) queue.push(u);
      }

      function normalizeLocalUrl(raw) {
        var u = String(raw || "").trim();
        if (!u) return "";
        var q = u.indexOf("?");
        var path = q >= 0 ? u.slice(0, q) : u;
        var query = q >= 0 ? u.slice(q) : "";
        return (
          "/" +
          path
            .replace(/^\/+/, "")
            .split("/")
            .map(function (part) {
              return encodeURIComponent(part);
            })
            .join("/") +
          query
        );
      }

      function frameUrl(raw) {
        var u = String(raw || "").trim();
        if (!u) return "";
        if (/^\/api\/game-frame\?/i.test(u)) return u;
        if (/^https?:\/\//i.test(u)) {
          if (isBlockedCdn(u)) return "";
          return "/api/game-frame?u=" + encodeURIComponent(u);
        }
        return normalizeLocalUrl(u);
      }

      function frameLooksBroken() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.body) return false;
          var text = String(doc.body.innerText || doc.body.textContent || "").trim();
          if (/^cannot get\b/i.test(text)) return true;
          if (/^404\b/i.test(text) && text.length < 120) return true;
          if (/fetch_failed|bad_url/i.test(text) && text.length < 120) return true;
        } catch (e) {}
        return false;
      }

      function runNext() {
        if (!frame || attempt >= queue.length) return;
        var url = frameUrl(queue[attempt]);
        attempt++;
        if (!url) {
          runNext();
          return;
        }
        frame.onload = function () {
          if (frameLooksBroken()) runNext();
        };
        frame.onerror = function () {
          runNext();
        };
        frame.src = url;
      }

      function startWithQueue() {
        queue = queue.filter(function (u) {
          return !isBlockedCdn(u);
        });
        if (!queue.length) return;
        attempt = 0;
        runNext();
      }

      function loadFromApi(gameId) {
        fetch("/api/game-launch/" + encodeURIComponent(gameId), { credentials: "same-origin" })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) throw new Error("launch failed");
              return data;
            });
          })
          .then(function (data) {
            (data.targets || []).forEach(function (t) {
              pushTarget(t.url || t);
            });
            if (!queue.length && data.path) pushTarget(data.path);
            startWithQueue();
          })
          .catch(function () {});
      }

      var gameId = String(params.get("id") || "").trim();
      if (gameId) {
        loadFromApi(gameId);
        return;
      }

      var single = params.get("src") || params.get("p") || "";
      if (single) pushTarget(single);

      var multi = params.get("targets") || params.get("t") || "";
      if (multi) {
        multi.split("|").forEach(function (part) {
          try {
            pushTarget(decodeURIComponent(part));
          } catch (e) {
            pushTarget(part);
          }
        });
      }

      startWithQueue();
    })();
  </script>
</body>
</html>
